name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        id: dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run --locked ruff check .

      - name: Format
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ruff format --check .

      - name: Typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked ty check

      - name: Tests
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: uv run --locked pytest -v
