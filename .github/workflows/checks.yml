name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: ${{ matrix.check.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        check:
          - name: Lint
            command: ruff check .
          - name: Format
            command: ruff format --check .
          - name: Typecheck
            command: ty check
          - name: Tests
            command: pytest -v
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: "3.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Run ${{ matrix.check.name }}
        run: uv run --locked ${{ matrix.check.command }}
