[project]
authors = [
  {name = "Smithed Team", email = "team@smithed.dev"},
]
dependencies = [
  "beet>=0.119.0",
  "mecha>=0.106.0",
  "typer>=0.9.0",
  "tokenstream>=1.7.0",
  "backports-strenum>=1.2.8",
  "rich>=13.6.0",
  "pydantic>=2.5.2",
  "lectern>=0.34.0",
]
description = "Smithed's Python client with CLI, Weld and more"
license = "MIT"
name = "smithed"
readme = "README.md"
requires-python = ">= 3.14"
version = "0.20.0"

[project.scripts]
weld = "smithed.weld:cli"

[dependency-groups]
dev = [
  "ruff>=0.17.1",
  "streamlit>=1.55.0",
  "pytest>=7.4.2",
  "pytest-insta>=0.2.0",
  "lectern>=0.29.1",
  "devtools>=0.12.2",
  "streamlit-extras>=0.4.0",
  {include-group = "github-workflows"},
  "ipython>=8.16.1",
  "twine>=5.0.0",
  "streamlit-elements>=0.1.0",
  "streamlit-router>=0.1.8",
  "ty>=0.0.89",
]

github-workflows = [
  "python-semantic-release>=10.7.0,<11",
]

[tool.semantic_release]
assets = ["uv.lock"]
build_command = """
uv lock --upgrade-package smithed
uv build
"""
allow_zero_version = true
major_on_zero = false
version_toml = ["pyproject.toml:project.version"]
version_variables = ["src/smithed/__init__.py:__version__", "src/smithed/weld/__init__.py:__version__"]

[tool.semantic_release.branches.main]
match = "main"
prerelease = false

[tool.uv]
no-build-package = ["pyarrow"]

[tool.ty.src]
include = ["src", "app", "tests"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.hatch.build.targets.wheel.force-include]
"smithed/weld" = "weld"

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
build-backend = "uv_build"
requires = ["uv_build>=0.7.19,<0.8.0"]
